          llm_description: 'Custom shell commands to run during template build (advanced
            feature).


            ## What is this?

            This field allows you to run arbitrary shell commands when building the
            template.

            These commands are executed inside a Docker container during the build
            process.

            Use this for advanced configurations that cannot be achieved with the
            other package fields.


            ## Input format

            Use semicolon (;) to separate multiple commands:

            "mkdir -p /home/user/data; chmod 755 /home/user/data; wget https://example.com/config.json
            -O /home/user/config.json"


            Alternatively, use newlines (press Enter) to separate commands:

            mkdir -p /home/user/data

            chmod 755 /home/user/data

            wget https://example.com/config.json -O /home/user/config.json


            ## Examples

            Single command:

            "echo ''export MY_VAR=value'' >> /home/user/.bashrc"


            Multiple commands (semicolon-separated):

            "mkdir -p /opt/tools; cd /opt/tools; wget https://example.com/tool.tar.gz;
            tar -xzf tool.tar.gz"


            ## When to use

            - Download and install custom tools not in APT/pip/npm

            - Create directories or configuration files

            - Set environment variables in .bashrc

            - Run custom setup scripts


            ## When NOT to use

            - For APT packages, use the "APT packages to install" field

            - For Python packages, use the "Python packages to install" field

            - For NPM packages, use the "NPM packages to install" field


            ## Execution context

            Commands run as root during Docker build. The final template will switch
            to "user" account.


            ## Reference

            - Defining Templates: https://e2b.dev/docs/template/defining-template

            '
