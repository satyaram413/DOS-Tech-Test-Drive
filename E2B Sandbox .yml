            ## Benefits

            Pre-cloning repositories during template build means:

            - Faster sandbox startup (no clone needed at runtime)

            - Consistent codebase version across all sandboxes

            - Reduced network usage during sandbox creation


            ## Clone location

            Repositories are cloned into /home/user/<repo-name>/


            ## Private repositories

            For private repos, use HTTPS URLs with personal access tokens:

            "https://<token>@github.com/user/private-repo"


            ## Reference

            - Template Quickstart: https://e2b.dev/docs/template/quickstart

