app:
  description: A2A demo that uses Web Scraper and Data Analyst workflow tools through Dify API calls, then passes outputs between specialist agents.
  icon: 🤖
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: workflow
  name: A2A Housing Intelligence
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/bedrock:0.0.66@afee1cbca3751d2c668d11ff86e52f51267ba97c98a98ac5231806412be541da
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInLoop: false
        sourceType: start
        targetType: http-request
      id: start-source-web-tool-target
      source: start
      sourceHandle: source
      target: web_tool_call
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: http-request
        targetType: http-request
      id: web-tool-source-data-tool-target
      source: web_tool_call
      sourceHandle: source
      target: data_tool_call
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: http-request
        targetType: llm
      id: data-tool-source-web-agent-target
      source: data_tool_call
      sourceHandle: source
      target: web_agent
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: llm
        targetType: llm
      id: web-agent-source-data-agent-target
      source: web_agent
      sourceHandle: source
      target: data_agent
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: llm
        targetType: llm
      id: data-agent-source-critic-target
      source: data_agent
      sourceHandle: source
      target: critic_agent
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: llm
        targetType: llm
      id: critic-source-final-target
      source: critic_agent
      sourceHandle: source
      target: final_agent
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: llm
        targetType: end
      id: final-source-end-target
      source: final_agent
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: User Input
        type: start
        variables:
        - default: Should a young professional rent a 2-bedroom non-landed home in Singapore now? Compare current market commentary with historical URA rental data and identify the best model for monthly gross rent.
          hint: The business question the agents should answer together.
          label: User Question
          options: []
          placeholder: Ask a housing/rental intelligence question
          required: true
          type: paragraph
          variable: user_question
        - default: https://raw.githubusercontent.com/satyaram413/DOS-Tech-Test-Drive/master/URA%2021%2026.csv
          hint: Direct raw CSV URL for the Data Analyst workflow.
          label: CSV URL
          options: []
          placeholder: https://raw.githubusercontent.com/.../data.csv
          required: true
          type: text-input
          variable: csv_url
        - default: ''
          hint: Article, URA page, or market commentary URL for the Web Scraper workflow.
          label: Web URL
          options: []
          placeholder: https://example.com/singapore-rental-market-article
          required: true
          type: text-input
          variable: web_url
        - default: https://api.dify.ai/v1
          hint: Dify API base URL.
          label: Dify API Base
          options: []
          placeholder: https://api.dify.ai/v1
          required: true
          type: text-input
          variable: dify_api_base
        - default: ''
          hint: API key from the published Web Scraper workflow app.
          label: Web Scraper API Key
          options: []
          placeholder: app-...
          required: true
          type: text-input
          variable: web_scraper_api_key
        - default: ''
          hint: API key from the published Data Analyst workflow app.
          label: Data Analyst API Key
          options: []
          placeholder: app-...
          required: true
          type: text-input
          variable: data_analyst_api_key
      height: 297
      id: start
      position:
        x: 0
        y: 120
      positionAbsolute:
        x: 0
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: |-
            {
              "inputs": {
                "url": "{{#start.web_url#}}",
                "instruction": "You are the Web Research Agent. Extract current market commentary relevant to this question: {{#start.user_question#}}. Return concise bullet points with dates, numbers, source caveats, and any claims that should be checked against data."
              },
              "response_mode": "blocking",
              "user": "a2a-workshop"
            }
          type: raw-text
        headers: 'Authorization:Bearer {{#start.web_scraper_api_key#}}

          Content-Type:application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 1000
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 120
          max_write_timeout: 20
        title: Call Web Scraper Tool
        type: http-request
        url: '{{#start.dify_api_base#}}/workflows/run'
        variables: []
      height: 168
      id: web_tool_call
      position:
        x: 340
        y: 20
      positionAbsolute:
        x: 340
        y: 20
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: |-
            {
              "inputs": {
                "csv_url": "{{#start.csv_url#}}",
                "analysis_question": "{{#start.user_question#}} Focus on monthly gross rent, key predictors, model comparison, best performing model, and caveats."
              },
              "response_mode": "blocking",
              "user": "a2a-workshop"
            }
          type: raw-text
        headers: 'Authorization:Bearer {{#start.data_analyst_api_key#}}

          Content-Type:application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 1000
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 300
          max_write_timeout: 20
        title: Call Data Analyst Tool
        type: http-request
        url: '{{#start.dify_api_base#}}/workflows/run'
        variables: []
      height: 168
      id: data_tool_call
      position:
        x: 680
        y: 20
      positionAbsolute:
        x: 680
        y: 20
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            cross-region: disabled
            model_name: Claude 3.5 Sonnet
            temperature: 0.2
          mode: chat
          name: anthropic claude
          provider: langgenius/bedrock/bedrock
        prompt_template:
        - edition_type: basic
          id: web-agent-system
          role: system
          text: 'You are the Web Research Agent. Your only job is to interpret the
            Web Scraper tool output. Use only the scraped/source content. Do not use
            the CSV analysis yet.'
        - edition_type: basic
          id: web-agent-user
          role: user
          text: 'Question:

            {{#start.user_question#}}


            Raw Web Scraper tool response:

            {{#web_tool_call.body#}}


            Return:

            - current market signals

            - useful dates/numbers

            - source caveats

            - claims the Data Agent should validate against structured data'
        selected: false
        title: Web Research Agent
        type: llm
        vision:
          enabled: false
      height: 88
      id: web_agent
      position:
        x: 1020
        y: 20
      positionAbsolute:
        x: 1020
        y: 20
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            cross-region: disabled
            model_name: Claude 3.5 Sonnet
            temperature: 0.2
          mode: chat
          name: anthropic claude
          provider: langgenius/bedrock/bedrock
        prompt_template:
        - edition_type: basic
          id: data-agent-system
          role: system
          text: 'You are the Data Agent. Your job is to interpret the Data Analyst
            tool output and respond to the Web Research Agent. Use only the tool output
            for data/model claims.'
        - edition_type: basic
          id: data-agent-user
          role: user
          text: 'Question:

            {{#start.user_question#}}


            Message from Web Research Agent:

            {{#web_agent.text#}}


            Raw Data Analyst tool response:

            {{#data_tool_call.body#}}


            Return:

            - historical data findings

            - ML target, features, best model, and metrics if present

            - whether the structured data supports or challenges web claims

            - data caveats and model caveats'
        selected: false
        title: Data Agent
        type: llm
        vision:
          enabled: false
      height: 88
      id: data_agent
      position:
        x: 1360
        y: 20
      positionAbsolute:
        x: 1360
        y: 20
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            cross-region: disabled
            model_name: Claude 3.5 Sonnet
            temperature: 0.15
          mode: chat
          name: anthropic claude
          provider: langgenius/bedrock/bedrock
        prompt_template:
        - edition_type: basic
          id: critic-system
          role: system
          text: 'You are the Critic Agent. Compare the Web Research Agent and Data
            Agent outputs. Look for conflicts, unsupported claims, missing evidence,
            and overconfident conclusions.'
        - edition_type: basic
          id: critic-user
          role: user
          text: 'Question:

            {{#start.user_question#}}


            Web Research Agent:

            {{#web_agent.text#}}


            Data Agent:

            {{#data_agent.text#}}


            Return:

            - agreements

            - conflicts

            - unsupported claims

            - what the Final Synthesis Agent should say carefully'
        selected: false
        title: Critic Agent
        type: llm
        vision:
          enabled: false
      height: 88
      id: critic_agent
      position:
        x: 1700
        y: 20
      positionAbsolute:
        x: 1700
        y: 20
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            cross-region: disabled
            model_name: Claude 3.5 Sonnet
            temperature: 0.2
          mode: chat
          name: anthropic claude
          provider: langgenius/bedrock/bedrock
        prompt_template:
        - edition_type: basic
          id: final-system
          role: system
          text: 'You are the Final Synthesis Agent. Produce a professional, evidence-based
            answer for government/data analysts. Use the prior agents as inputs and
            clearly separate web evidence from data/model evidence.'
        - edition_type: basic
          id: final-user
          role: user
          text: 'Question:

            {{#start.user_question#}}


            Web Research Agent:

            {{#web_agent.text#}}


            Data Agent:

            {{#data_agent.text#}}


            Critic Agent:

            {{#critic_agent.text#}}


            Produce:

            ## Executive Answer

            ## Web Evidence

            ## Data and Model Evidence

            ## Where Agents Agree or Disagree

            ## Recommendation

            ## Caveats'
        selected: false
        title: Final Synthesis Agent
        type: llm
        vision:
          enabled: false
      height: 88
      id: final_agent
      position:
        x: 2040
        y: 20
      positionAbsolute:
        x: 2040
        y: 20
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        outputs:
        - value_selector:
          - final_agent
          - text
          value_type: string
          variable: final_answer
        - value_selector:
          - web_agent
          - text
          value_type: string
          variable: web_agent_message
        - value_selector:
          - data_agent
          - text
          value_type: string
          variable: data_agent_message
        - value_selector:
          - critic_agent
          - text
          value_type: string
          variable: critic_agent_message
        selected: false
        title: Output
        type: end
      height: 167
      id: end
      position:
        x: 2380
        y: 20
      positionAbsolute:
        x: 2380
        y: 20
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    viewport:
      x: -180
      y: 120
      zoom: 0.8
  rag_pipeline_variables: []
