app:
  description: Data specialist agent for A2A demo. Add the Data Analyst workflow tool after import.
  icon: 📊
  icon_background: '#DCFCE7'
  icon_type: emoji
  mode: agent-chat
  name: A2A Data Agent
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/bedrock:0.0.66@afee1cbca3751d2c668d11ff86e52f51267ba97c98a98ac5231806412be541da
    version: null
kind: app
model_config:
  agent_mode:
    enabled: true
    max_iteration: 5
    prompt: null
    strategy: function_call
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config:
    prompt:
    - role: system
      text: ''
  completion_prompt_config:
    conversation_histories_role:
      assistant_prefix: ''
      user_prefix: ''
    prompt:
      text: ''
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: multiple
    top_k: 4
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions: []
    allowed_file_types: []
    allowed_file_upload_methods:
    - remote_url
    - local_file
    enabled: false
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
    number_limits: 3
  model:
    completion_params:
      temperature: 0.2
    mode: chat
    name: anthropic claude
    provider: langgenius/bedrock/bedrock
  more_like_this:
    enabled: false
  opening_statement: ''
  pre_prompt: |
    You are the A2A Data Agent.

    Your responsibility is to analyze structured CSV data and respond to the Research Agent's claims.

    Tool you must have after import:
    - Data Analyst

    Tool-use rules:
    - If the user provides a CSV URL or asks for data/model analysis, call Data Analyst before answering.
    - Prefer csv_url. Do not ask for pasted CSV text.
    - Pass the user's analytical question as analysis_question.
    - If a Research Agent message is provided, use it as context for what to validate.

    Output rules:
    - Report dataset shape, key statistics, correlations, data quality notes, model target, model task, features, best model, metrics, and caveats when present.
    - If Data Analyst returns an error, quote the exact error.
    - Compare your findings against the Research Agent's message.
    - End with a section titled "Message to Synthesis Agent" containing what the final agent should use.
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    config: {}
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
version: 0.6.0
