app:
  description: Two-agent A2A feedback loop. Calls Research Agent and Data Agent in alternating rounds, then synthesizes.
  icon: 🤝
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: A2A Agents Orchestrator
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/bedrock:0.0.66@afee1cbca3751d2c668d11ff86e52f51267ba97c98a98ac5231806412be541da
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInLoop: false
        sourceType: start
        targetType: http-request
      id: start-source-research-r1-target
      source: start
      sourceHandle: source
      target: research_round_1
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: http-request
        targetType: http-request
      id: research-r1-source-data-r1-target
      source: research_round_1
      sourceHandle: source
      target: data_round_1
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: http-request
        targetType: http-request
      id: data-r1-source-research-feedback-target
      source: data_round_1
      sourceHandle: source
      target: research_feedback
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: http-request
        targetType: http-request
      id: research-feedback-source-data-revision-target
      source: research_feedback
      sourceHandle: source
      target: data_revision
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: http-request
        targetType: llm
      id: data-revision-source-synthesis-target
      source: data_revision
      sourceHandle: source
      target: synthesis_agent
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: llm
        targetType: end
      id: synthesis-source-end-target
      source: synthesis_agent
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: User Input
        type: start
        variables:
        - default: Compare current Singapore private residential rental market commentary with historical URA rental data. What drives monthly gross rent, what is the best performing predictive model, and should a young professional rent a 2-bedroom non-landed home now?
          hint: Overall question for both agents.
          label: User Question
          options: []
          placeholder: Ask rental/data intelligence question
          required: true
          type: paragraph
          variable: user_question
        - default: https://raw.githubusercontent.com/satyaram413/DOS-Tech-Test-Drive/master/URA%2021%2026.csv
          hint: Raw CSV URL for Data Agent.
          label: CSV URL
          options: []
          placeholder: https://raw.githubusercontent.com/.../data.csv
          required: true
          type: text-input
          variable: csv_url
        - default: ''
          hint: Web page for Research Agent.
          label: Web URL
          options: []
          placeholder: https://www.ura.gov.sg/...
          required: true
          type: text-input
          variable: web_url
        - default: https://api.dify.ai/v1
          hint: Dify API base URL.
          label: Dify API Base
          options: []
          placeholder: https://api.dify.ai/v1
          required: true
          type: text-input
          variable: dify_api_base
        - default: ''
          hint: API key for published A2A Research Agent app.
          label: Research Agent API Key
          options: []
          placeholder: app-...
          required: true
          type: text-input
          variable: research_agent_api_key
        - default: ''
          hint: API key for published A2A Data Agent app.
          label: Data Agent API Key
          options: []
          placeholder: app-...
          required: true
          type: text-input
          variable: data_agent_api_key
      height: 297
      id: start
      position:
        x: 0
        y: 120
      positionAbsolute:
        x: 0
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: |-
            {
              "inputs": {},
              "query": "ROUND 1. You are Research Agent. Use your Web Scraper tool to read this URL: {{#start.web_url#}}\n\nUser question: {{#start.user_question#}}\n\nReturn web evidence, caveats, and a section named Message to Data Agent with claims the Data Agent should validate.",
              "response_mode": "blocking",
              "user": "a2a-feedback-demo"
            }
          type: raw-text
        headers: 'Authorization:Bearer {{#start.research_agent_api_key#}}

          Content-Type:application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 1000
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 180
          max_write_timeout: 20
        title: Research Agent - Round 1
        type: http-request
        url: '{{#start.dify_api_base#}}/chat-messages'
        variables: []
      height: 168
      id: research_round_1
      position:
        x: 340
        y: 80
      positionAbsolute:
        x: 340
        y: 80
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: |-
            {
              "inputs": {},
              "query": "ROUND 1. You are Data Agent. Use your Data Analyst tool on this CSV URL: {{#start.csv_url#}}\n\nUser question: {{#start.user_question#}}\n\nResearch Agent message to validate:\n{{#research_round_1.body#}}\n\nReturn data findings, best model details, agreements/disagreements with Research Agent, and a section named Message to Research Agent with feedback or challenges.",
              "response_mode": "blocking",
              "user": "a2a-feedback-demo"
            }
          type: raw-text
        headers: 'Authorization:Bearer {{#start.data_agent_api_key#}}

          Content-Type:application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 1000
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 420
          max_write_timeout: 20
        title: Data Agent - Round 1
        type: http-request
        url: '{{#start.dify_api_base#}}/chat-messages'
        variables: []
      height: 168
      id: data_round_1
      position:
        x: 680
        y: 80
      positionAbsolute:
        x: 680
        y: 80
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: |-
            {
              "inputs": {},
              "query": "ROUND 2 FEEDBACK. You are Research Agent. Review Data Agent response and respond only with feedback.\n\nOriginal user question: {{#start.user_question#}}\n\nYour Round 1 response:\n{{#research_round_1.body#}}\n\nData Agent Round 1 response:\n{{#data_round_1.body#}}\n\nTasks:\n1. Identify where Data Agent confirmed or challenged your web claims.\n2. Identify any data/model caveats that change your interpretation.\n3. Ask Data Agent up to three concrete follow-up questions or requested revisions.\n4. End with Message to Data Agent.",
              "response_mode": "blocking",
              "user": "a2a-feedback-demo"
            }
          type: raw-text
        headers: 'Authorization:Bearer {{#start.research_agent_api_key#}}

          Content-Type:application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 1000
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 180
          max_write_timeout: 20
        title: Research Agent - Feedback
        type: http-request
        url: '{{#start.dify_api_base#}}/chat-messages'
        variables: []
      height: 168
      id: research_feedback
      position:
        x: 1020
        y: 80
      positionAbsolute:
        x: 1020
        y: 80
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: |-
            {
              "inputs": {},
              "query": "ROUND 2 REVISION. You are Data Agent. Revise your answer after Research Agent feedback.\n\nOriginal user question: {{#start.user_question#}}\n\nCSV URL: {{#start.csv_url#}}\n\nResearch Agent Round 1:\n{{#research_round_1.body#}}\n\nYour Round 1:\n{{#data_round_1.body#}}\n\nResearch Agent feedback:\n{{#research_feedback.body#}}\n\nUse Data Analyst again only if needed. Otherwise reason from your existing tool result. Return final data position, model caveats, and Message to Synthesis Agent.",
              "response_mode": "blocking",
              "user": "a2a-feedback-demo"
            }
          type: raw-text
        headers: 'Authorization:Bearer {{#start.data_agent_api_key#}}

          Content-Type:application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 1000
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 420
          max_write_timeout: 20
        title: Data Agent - Revision
        type: http-request
        url: '{{#start.dify_api_base#}}/chat-messages'
        variables: []
      height: 168
      id: data_revision
      position:
        x: 1360
        y: 80
      positionAbsolute:
        x: 1360
        y: 80
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            cross-region: disabled
            model_name: Claude 3.5 Sonnet
            temperature: 0.2
          mode: chat
          name: anthropic claude
          provider: langgenius/bedrock/bedrock
        prompt_template:
        - edition_type: basic
          id: synthesis-system
          role: system
          text: 'You are Synthesis Agent. You receive two-agent feedback-loop transcript.
            Produce final answer. Show how feedback changed conclusion.'
        - edition_type: basic
          id: synthesis-user
          role: user
          text: 'User question:

            {{#start.user_question#}}


            Research Agent Round 1:

            {{#research_round_1.body#}}


            Data Agent Round 1:

            {{#data_round_1.body#}}


            Research Agent Feedback:

            {{#research_feedback.body#}}


            Data Agent Revision:

            {{#data_revision.body#}}


            Produce:

            ## Executive Answer

            ## Agent Feedback Loop

            ## Web Evidence

            ## Data and Model Evidence

            ## What Changed After Feedback

            ## Recommendation

            ## Caveats'
        selected: false
        title: Synthesis Agent
        type: llm
        vision:
          enabled: false
      height: 88
      id: synthesis_agent
      position:
        x: 1700
        y: 80
      positionAbsolute:
        x: 1700
        y: 80
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        outputs:
        - value_selector:
          - synthesis_agent
          - text
          value_type: string
          variable: final_answer
        - value_selector:
          - research_round_1
          - body
          value_type: string
          variable: research_round_1
        - value_selector:
          - data_round_1
          - body
          value_type: string
          variable: data_round_1
        - value_selector:
          - research_feedback
          - body
          value_type: string
          variable: research_feedback
        - value_selector:
          - data_revision
          - body
          value_type: string
          variable: data_revision
        selected: false
        title: Output
        type: end
      height: 219
      id: end
      position:
        x: 2040
        y: 80
      positionAbsolute:
        x: 2040
        y: 80
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    viewport:
      x: -120
      y: 120
      zoom: 0.8
  rag_pipeline_variables: []
