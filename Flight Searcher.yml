app:
  description: 'Use this tool for flight search between cities or countries. Provide
    origin, destination, and optional dates. Reads public flight-comparison pages
    and returns indicative airlines, routes, prices, and caveats. Does not book
    tickets or guarantee live fares. Not for CSV, housing, CPI, or market data.

    '
  icon: ✈️
  icon_background: '#DBEAFE'
  icon_type: emoji
  mode: workflow
  name: Flight Searcher
  use_icon_as_answer_icon: false
