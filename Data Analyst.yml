          llm_description: 'Template alias (or template ID) used to create the sandbox.


            ## What is a template alias?

            A template alias is a human-readable name that points to a specific template.

            It''s like a shortcut name for a pre-configured sandbox environment.


            ## How to fill this field

            Enter the template alias as a simple string. No quotes needed in the UI.


            ## Default behavior

            - Leave empty: Uses E2B default "base" template (minimal Ubuntu environment)

            - "base": Same as empty, explicitly uses default base template


            ## Custom templates

            If you have built custom templates using the "Build Custom Template" tool,
            you can use their alias here.

            Use the "List Templates" tool to see all available templates in your account.


            ## Official E2B example templates

            E2B provides several official example templates:

            - claude-code: Claude Code sandbox with coding capabilities

            - base: Default sandbox template (no preinstalled app)

            - claude-code: Claude Code environment (if available in your account)


            **However**, for these official templates, we have already created dedicated
            tools in this plugin that are more convenient:

            - "Create Claude Code Sandbox" for claude-code

            - "Create Next.js Sandbox"

            - "Create Next.js (Bun) Sandbox"

            - "Create Claude Code Sandbox"


            Using these dedicated tools is recommended as they handle template-specific
            configurations automatically.


            ## How to find available templates

            - Use "List Templates" tool to see all templates in your account

            - Check your E2B Dashboard: https://e2b.dev/dashboard


            ## Reference

            - Template Aliases: https://e2b.dev/docs/template/aliases

            - Template Quickstart: https://e2b.dev/docs/template/quickstart

            '
