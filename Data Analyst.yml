          default: sandbox_global
          form: llm
          human_description:
            en_US: 'Choose how envs_json is applied. Sandbox Global: env vars are
              set at sandbox creation and persist across all commands. Command Only:
              env vars are not set at creation; you inject them per-command later.
              Note: Environment files are NOT private in the OS. Please be careful
              with sensitive data.'
            ja_JP: envs_json の適用方法を選択します。Sandbox Global：作成時に環境変数を設定し、すべてのコマンドで永続化。Command
              Only：作成時に設定せず、後でコマンドごとに注入。注意：環境変数ファイルは OS 上でプライベートではありません。機密データにご注意ください。
            pt_BR: 'Escolha como envs_json é aplicado. Sandbox Global: variáveis são
              definidas na criação e persistem em todos os comandos. Command Only:
              variáveis não são definidas na criação; injete por comando depois. Nota:
              Arquivos de ambiente NÃO são privados no SO. Tenha cuidado com dados
              sensíveis.'
            zh_Hans: 选择 envs_json 的注入方式。Sandbox Global：在沙盒创建时设置环境变量，对所有命令持久生效。Command
              Only：创建时不设置环境变量，需要在后续每个命令中单独注入。注意：环境变量文件在操作系统层面并不私密，请谨慎处理敏感数据。
          label:
            en_US: Environment Injection Scope (Optional)
            ja_JP: 環境変数の注入範囲（任意）
            pt_BR: Escopo de Injeção de Ambiente (Opcional)
            zh_Hans: 环境变量注入范围（可选）
          llm_description: 'Where to inject environment variables from envs_json.


            ## Options Explained


            ### Sandbox Global (default)

            Environment variables are set at sandbox creation time and persist for
            the ENTIRE sandbox lifetime.

            - All commands, scripts, and processes inherit these env vars automatically

            - Even if you close a shell and open a new one, the env vars are still
            there

            - Env vars persist until the sandbox is killed or expires

            - Use this when you want env vars available everywhere in the sandbox


            Example: If you set API_KEY=xxx with Sandbox Global, every command you
            run in the sandbox can access API_KEY.


            ### Command Only

            Environment variables are NOT set at sandbox creation.

            - Env vars from envs_json are stored but not applied globally

            - Once you close the shell or command, the env vars are GONE

            - Opening a new shell will NOT have these env vars

            - Creating a new sandbox will NOT inherit these env vars

            - You must explicitly inject them for each specific command


            Example: If you set API_KEY=xxx with Command Only, only that specific
            command sees API_KEY. The next command you run will NOT have API_KEY.


            ## Security Warning

            Environment files are NOT private in the OS. Please be careful when storing
            sensitive data like API keys or passwords. Any process running in the
            sandbox can read environment variables.


            Reference: https://e2b.dev/docs/sandbox/environment-variables

            '
